# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name marryme.web.id *.marryme.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name marryme.web.id *.marryme.web.id;

    ssl_certificate     /etc/letsencrypt/live/marryme.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marryme.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff2;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite) — long cache OK
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|woff2|mp3)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Non-hashed 3D models — shorter cache so model updates are not stuck for 1y
    location ~* \.(?:gltf|glb|bin)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
