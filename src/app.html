<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.png" />
  <link rel="preload" href="%sveltekit.assets%/models/tamu.glb" as="fetch" crossorigin="anonymous" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta property="og:title" content="Undangan Pernikahan 3D — Kia & Toni" />
  <meta property="og:description" content="Jelajahi dunia 3D interaktif pernikahan Kia & Toni" />
  <meta property="og:type" content="website" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff8ef; }
    #startup-shell {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2rem;
      background: linear-gradient(160deg, #fff8ef 0%, #fbe6d8 55%, #f3cdbf 100%);
      color: #33262b;
      text-align: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    #startup-shell .mark { font-size: 2.25rem; animation: startup-pulse 1.2s ease-in-out infinite; }
    #startup-shell h1 { margin: 1rem 0 0; color: #8b3f50; font-family: Georgia, serif; font-size: clamp(1.6rem, 6vw, 2rem); }
    #startup-shell p { margin: .75rem 0 0; max-width: 22rem; color: rgba(51, 38, 43, .65); font-size: .875rem; line-height: 1.5; }
    #startup-shell .bar { width: min(22rem, 100%); height: .375rem; margin-top: 2rem; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .55); }
    #startup-shell .bar::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d96b7a, #d9b77b); content: ""; animation: startup-load 1.1s ease-in-out infinite; }
    @keyframes startup-pulse { 50% { transform: scale(1.08); opacity: .72; } }
    @keyframes startup-load { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
    @media (prefers-reduced-motion: reduce) { #startup-shell .mark, #startup-shell .bar::after { animation-duration: 2.5s; } }
  </style>
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div id="startup-shell" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">&#128150;</div>
    <h1>Halo, Undangan yang Terhormat</h1>
    <p>Sedang menyiapkan undangan pernikahan KIA &amp; TONI</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
