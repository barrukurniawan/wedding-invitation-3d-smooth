<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:title" content="MarryMe | Undangan Pernikahan 3D" />
  <meta property="og:description" content="Buat dan bagikan undangan pernikahan 3D interaktif Anda." />
  <meta property="og:type" content="website" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #fdf8f4; }
    #startup-shell {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2rem;
      background: radial-gradient(circle at 50% 35%, #fce8ee 0, #fffcfd 42%);
      color: #2a1f24;
      text-align: center;
      font-family: Outfit, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
     #startup-shell .mark { color: #c44565; font: 600 1rem/1 "Playfair Display", Georgia, serif; letter-spacing: .18em; animation: startup-pulse 1.2s ease-in-out infinite; }
     #startup-shell h1 { margin: 1rem 0 0; color: #713645; font-family: "Playfair Display", Georgia, serif; font-size: clamp(1.6rem, 6vw, 2.2rem); }
    #startup-shell p { margin: .75rem 0 0; max-width: 22rem; color: #806e72; font-size: .875rem; line-height: 1.5; }
    #startup-shell .bar { width: min(22rem, 100%); height: .375rem; margin-top: 2rem; overflow: hidden; border-radius: 999px; background: #f0e4e8; }
     #startup-shell .bar::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: repeating-linear-gradient(135deg, #f03355 0 10px, #ffa516 0 20px); content: ""; animation: startup-load 1.1s ease-in-out infinite; }
    @keyframes startup-pulse { 50% { transform: scale(1.08); opacity: .72; } }
    @keyframes startup-load { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
    @media (prefers-reduced-motion: reduce) { #startup-shell .mark, #startup-shell .bar::after { animation-duration: 2.5s; } }
  </style>
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div id="startup-shell" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">MARRYME</div>
    <h1>Menyiapkan undangan</h1>
    <p>Memuat ruang interaktif.</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
