<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:title" content="MarryMe | Undangan Pernikahan 3D" />
  <meta property="og:description" content="Buat dan bagikan undangan pernikahan 3D interaktif Anda." />
  <meta property="og:type" content="website" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #fdf8f4; }
    #startup-shell {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2rem;
       background: linear-gradient(160deg, #fff8ef 0%, #fbe6d8 55%, #f3cdbf 100%);
      color: #2a1f24;
      text-align: center;
       font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
     #startup-shell .mark { color: #c44565; font: 600 .9rem/1 Georgia, "Times New Roman", serif; letter-spacing: .18em; }
     #startup-shell h1 { margin: 1rem 0 0; color: #713645; font: 600 clamp(1.6rem, 6vw, 2.2rem)/1.05 Georgia, "Times New Roman", serif; }
    #startup-shell p { margin: .75rem 0 0; max-width: 22rem; color: #806e72; font-size: .875rem; line-height: 1.5; }
     #startup-shell .bar { width: min(22rem, calc(100vw - 4rem)); height: .3rem; margin-top: 2rem; overflow: hidden; border-radius: 999px; background: rgba(113, 54, 69, .14); }
     #startup-shell .bar::after { display: block; width: 32%; height: 100%; border-radius: inherit; background: #d96b7a; content: ""; animation: startup-load 1.4s ease-in-out infinite; }
     @keyframes startup-load { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
     @media (prefers-reduced-motion: reduce) { #startup-shell .bar::after { animation-duration: 2.5s; } }
  </style>
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div id="startup-shell" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">MARRYME</div>
    <h1>Menyiapkan undangan</h1>
    <p>Memuat ruang interaktif.</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
