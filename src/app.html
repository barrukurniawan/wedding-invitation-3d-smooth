<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js?v=20261011');
      });
    }
  </script>
  <meta property="og:title" content="MarryMe | Undangan Pernikahan 3D" />
  <meta property="og:description" content="Buat dan bagikan undangan pernikahan 3D interaktif Anda." />
  <meta property="og:type" content="website" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #fdf8f4; }
    #startup-shell {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2rem;
       background: linear-gradient(160deg, #fff8ef 0%, #fbe6d8 55%, #f3cdbf 100%);
      color: #2a1f24;
      text-align: center;
       font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
     #startup-shell .mark { color: #c44565; font: 600 .9rem/1 Georgia, "Times New Roman", serif; letter-spacing: .18em; }
     #startup-shell h1 { margin: 1rem 0 0; color: #713645; font: 600 clamp(1.6rem, 6vw, 2.2rem)/1.05 Georgia, "Times New Roman", serif; }
    #startup-shell p { margin: .75rem 0 0; max-width: 22rem; color: #806e72; font-size: .875rem; line-height: 1.5; }
     #startup-shell .bar { width: min(22rem, calc(100vw - 4rem)); height: .3rem; margin-top: 2rem; overflow: hidden; border-radius: 999px; background: rgba(113, 54, 69, .14); }
     #startup-shell .bar::after { display: block; width: 32%; height: 100%; border-radius: inherit; background: #d96b7a; content: ""; animation: startup-load 1.4s ease-in-out infinite; }
     @keyframes startup-load { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
     @media (prefers-reduced-motion: reduce) { #startup-shell .bar::after { animation-duration: 2.5s; } }
    #startup-shell.is-platform { background: #fdf8f4; }
    #startup-shell.is-platform .mark { display: none; }
    #startup-shell.is-platform h1 { margin: 0; color: #292321; font: 600 clamp(2rem, 7vw, 2.6rem)/1 "Playfair Display", Georgia, serif; letter-spacing: -0.035em; }
    #startup-shell.is-platform h1 span { color: #8f1d45; }
    #startup-shell.is-platform .bar { width: min(10rem, 50vw); margin-top: 1.4rem; }
  </style>
  <!-- DNS prefetch & preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div id="startup-shell" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">MARRYME</div>
    <h1>Menyiapkan undangan</h1>
    <p>Memuat ruang interaktif.</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <script>
    // Layar awal ini dipakai semua halaman. Teks "Menyiapkan undangan" hanya untuk subdomain
    // undangan; di marryme.web.id dan /admin cukup logo (logika sama dengan routing/host.ts).
    (function () {
      var h = location.hostname.toLowerCase()
      var root = h === 'localhost' || h === '127.0.0.1' || h === 'marryme.web.id' || h === 'www.marryme.web.id'
      if (!root && location.pathname.indexOf('/admin') !== 0) return
      var shell = document.getElementById('startup-shell')
      if (!shell) return
      shell.classList.add('is-platform')
      shell.querySelector('h1').innerHTML = 'Marry<span>Me</span>'
      shell.querySelector('p').remove()
    })()
  </script>
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
