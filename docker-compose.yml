services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: wedding_db
      MYSQL_USER: wedding
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - wedding-net

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: wedding
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: wedding_db
      NODE_ENV: production
      COOKIE_SECURE: "true"
      PORT: "3001"
      BASE_DOMAIN: marryme.web.id
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - wedding-net

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: "no"
    command: ["node", "scripts/migrate.js"]
    env_file:
      - ./server/.env.docker
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: wedding
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: wedding_db
      MIGRATIONS_DIR: /app/database/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wedding-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PAYMENT_MODE: ${VITE_PAYMENT_MODE:-manual}
        VITE_INVITATION_PRICE_IDR: ${VITE_INVITATION_PRICE_IDR:-0}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - wedding-net

volumes:
  db_data:
  certbot_www:

networks:
  wedding-net:
    driver: bridge
